# tmux — for terminal training/mastery (AGENTS.md). Herdr does agent
# orchestration; do not recreate Herdr layouts here.
# Keybinding layering: Ghostty owns cmd+*, tmux owns the prefix below.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 100000
setw -g mode-keys vi
set -g set-clipboard on
set -g focus-events on

# Vim-style pane movement (matches Neovim muscle memory)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable vim-style pane resize (hold prefix, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy-mode: vim selection + yank to system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Quick window hop (prefix Tab = last window, like alt-tab)
bind Tab last-window

# Intuitive splits, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Catppuccin Mocha (AGENTS.md theme rule) — manual palette to stay
# plugin-free; Phase 2 may switch to the official catppuccin/tmux plugin.
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#cba6f7,bold]#S "
set -g status-right "#[fg=#a6adc8]%H:%M"
setw -g window-status-current-style "fg=#89b4fa,bold"
setw -g window-status-style "fg=#6c7086"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
